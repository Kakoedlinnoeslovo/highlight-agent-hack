<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Highlight Agent — one recording, different stories</title>
  <desc id="description">A concept illustration of a source recording branching into two edits: clean landings for a professional highlight, and crashes for a playful driving roast.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b1c19"/>
      <stop offset="0.55" stop-color="#111210"/>
      <stop offset="1" stop-color="#171b12"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#292e23"/>
      <stop offset="1" stop-color="#20241b"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#d4ef79" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="pro-clip"><rect x="574" y="320" width="250" height="82" rx="8"/></clipPath>
    <clipPath id="roast-clip"><rect x="866" y="320" width="250" height="82" rx="8"/></clipPath>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" stroke="#35392d"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="40" width="28" height="28" rx="8" fill="#d4ef79"/>
    <path d="M67 48V60L77 54L67 48Z" fill="#111210"/>
    <text x="97" y="61" font-size="21" font-weight="700" letter-spacing="-0.7" fill="#f1f0e8">Highlight Agent</text>
    <text x="1140" y="58" text-anchor="end" font-size="11" font-weight="700" letter-spacing="2" fill="#929983">ONE SOURCE. MORE POSSIBILITIES.</text>

    <text x="56" y="173" font-size="63" font-weight="700" letter-spacing="-3.2" fill="#f1f0e8">One recording.</text>
    <text x="56" y="244" font-size="63" font-weight="700" letter-spacing="-3.2" fill="#d4ef79">Different stories.</text>
    <text x="59" y="294" font-size="19" fill="#b2b7a4">Bring the footage.</text>
    <text x="59" y="323" font-size="19" fill="#b2b7a4">Tell the agent what makes the cut.</text>

    <path d="M59 396H467" stroke="#35392d"/>
    <text x="59" y="427" font-size="11" font-weight="700" letter-spacing="1.6" fill="#929983">YOUR FOOTAGE</text>
    <path d="M185 423H205M201 419L205 423L201 427" stroke="#6f775f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="222" y="427" font-size="11" font-weight="700" letter-spacing="1.6" fill="#929983">YOUR BRIEF</text>
    <path d="M327 423H347M343 419L347 423L343 427" stroke="#6f775f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="364" y="427" font-size="11" font-weight="700" letter-spacing="1.6" fill="#d4ef79">YOUR CUT</text>

    <rect x="552" y="113" width="586" height="119" rx="14" fill="#1b1c19" stroke="#35392d"/>
    <circle cx="577" cy="138" r="3" fill="#d4ef79"/>
    <text x="589" y="142" font-size="10" font-weight="700" letter-spacing="1.8" fill="#b2b7a4">SOURCE RECORDING</text>
    <text x="1116" y="142" text-anchor="end" font-size="10" letter-spacing="0.5" fill="#929983">raw footage</text>

    <rect x="573" y="159" width="544" height="51" rx="6" fill="#111210"/>
    <path d="M589 185H1100" stroke="#35392d"/>
    <g stroke="#6f775f" stroke-width="3" stroke-linecap="round">
      <path d="M590 181V189M599 175V195M608 178V192M617 182V188M626 170V200M635 174V196M644 177V193M653 168V202M662 174V196M671 180V190M680 176V194M689 171V199M698 179V191M707 182V188M716 175V195M725 169V201M734 172V198M743 178V192M752 181V189M761 176V194M770 172V198M779 168V202M788 176V194M797 180V190M806 178V192M815 172V198M824 175V195M833 180V190M842 177V193M851 171V199M860 176V194M869 182V188M878 179V191M887 172V198M896 168V202M905 173V197M914 177V193M923 181V189M932 176V194M941 170V200M950 175V195M959 179V191M968 183V187M977 178V192M986 171V199M995 167V203M1004 173V197M1013 176V194M1022 180V190M1031 177V193M1040 172V198M1049 176V194M1058 181V189M1067 178V192M1076 174V196M1085 179V191M1094 182V188"/>
    </g>
    <rect x="635" y="161" width="94" height="47" rx="3" fill="#d4ef79" fill-opacity="0.08" stroke="#d4ef79" stroke-opacity="0.5"/>
    <rect x="962" y="161" width="69" height="47" rx="3" fill="#d4ef79" fill-opacity="0.08" stroke="#d4ef79" stroke-opacity="0.5"/>
    <path d="M845 232V249C845 255 841 259 835 259H709C703 259 699 263 699 269V279M845 249C845 255 849 259 855 259H981C987 259 991 263 991 269V279" stroke="#71804f" stroke-width="1.5"/>
    <circle cx="845" cy="232" r="3" fill="#d4ef79"/>

    <rect x="552" y="280" width="286" height="173" rx="14" fill="#1b1c19" stroke="#4b543b"/>
    <text x="574" y="306" font-size="11" font-weight="700" letter-spacing="0.8" fill="#f1f0e8">MAKE ME LOOK LIKE A PRO</text>
    <g clip-path="url(#pro-clip)">
      <rect x="574" y="320" width="250" height="82" rx="8" fill="url(#frame)"/>
      <path d="M563 402C618 397 620 363 661 360C705 357 747 394 840 325" stroke="#3d4432" stroke-width="37"/>
      <path d="M563 402C618 397 620 363 661 360C705 357 747 394 840 325" stroke="#5b654a" stroke-width="1.5" stroke-dasharray="7 9"/>
      <path d="M636 364C650 358 666 358 681 363" stroke="#d4ef79" stroke-width="2" stroke-linecap="round"/>
      <g transform="translate(698 368) rotate(9)">
        <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#d4ef79"/>
        <rect x="-3" y="-4" width="9" height="8" rx="1.5" fill="#303a21"/>
        <path d="M-8 -7V-5M9 -7V-5M-8 5V7M9 5V7" stroke="#111210" stroke-width="3"/>
      </g>
      <path d="M793 337L798 342L808 330" stroke="#d4ef79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="579" cy="428" r="3" fill="#d4ef79"/>
    <text x="591" y="432" font-size="12" fill="#b2b7a4">Clean landings. All confidence.</text>

    <rect x="852" y="280" width="286" height="173" rx="14" fill="#1b1c19" stroke="#35392d"/>
    <text x="866" y="306" font-size="11" font-weight="700" letter-spacing="0.8" fill="#f1f0e8">NOW ROAST MY DRIVING</text>
    <g clip-path="url(#roast-clip)">
      <rect x="866" y="320" width="250" height="82" rx="8" fill="url(#frame)"/>
      <path d="M855 402C910 397 912 363 953 360C997 357 1039 394 1132 325" stroke="#3d4432" stroke-width="37"/>
      <path d="M855 402C910 397 912 363 953 360C997 357 1039 394 1132 325" stroke="#5b654a" stroke-width="1.5" stroke-dasharray="7 9"/>
      <path d="M955 360C973 353 982 381 1002 371M954 366C972 359 981 387 1001 377" stroke="#929983" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
      <g transform="translate(1015 366) rotate(-39)">
        <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#d4ef79"/>
        <rect x="-3" y="-4" width="9" height="8" rx="1.5" fill="#303a21"/>
        <path d="M-8 -7V-5M9 -7V-5M-8 5V7M9 5V7" stroke="#111210" stroke-width="3"/>
      </g>
      <path d="M1025 346L1028 338M1034 351L1042 347M1034 360L1042 363" stroke="#d4ef79" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <circle cx="871" cy="428" r="3" fill="#929983"/>
    <text x="883" y="432" font-size="12" fill="#b2b7a4">Every crash has a punchline.</text>

    <text x="1140" y="490" text-anchor="end" font-size="10" letter-spacing="0.6" fill="#929983">Concept illustration</text>
  </g>
</svg>
